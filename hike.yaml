  difficulty_en: "Challenging multi-day hike"
  difficulty_fr: "Randonnée exigeante sur plusieurs jours"
  description_en: "A 28.3 km loop from Pont du Countet (1,684 m): Day 1 climbs to Refuge de Nice (2,223 m) for the first bivouac. Day 2 is the hard part — on to Refuge de Valmasque (2,225 m, a possible fallback overnight if the group is tired) and then Refuge des Merveilles (2,121 m) for the second bivouac. Day 3 descends back down to the cars at Pont du Countet."
  description_fr: "Une boucle de 28,3 km depuis le Pont du Countet (1 684 m) : le jour 1 monte jusqu’au Refuge de Nice (2 223 m) pour le premier bivouac. Le jour 2 est la partie difficile — direction le Refuge de Valmasque (2 225 m, un possible bivouac de repli si le groupe est fatigué) puis le Refuge des Merveilles (2 121 m) pour la deuxième nuit. Le jour 3 redescend jusqu’aux voitures au Pont du Countet."
