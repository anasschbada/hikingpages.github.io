  meet_time_en: "Friday · 12:00–13:00 from Antibes / Nice"
  meet_time_fr: "Vendredi · 12h00–13h00 depuis Antibes / Nice"
  description_en: "A three-day escape into the wild alpine–Mediterranean landscapes of Mercantour National Park: high valleys, mineral ridges and starry camp evenings."
  description_fr: "Une parenthèse de trois jours dans les paysages alpins et méditerranéens sauvages du Parc national du Mercantour : hautes vallées, crêtes minérales et soirées sous les étoiles."
  travel_en: "Antibes / Nice → Pont du Countet: leave by 12:00–13:00 at the latest, park the cars there, then the hike begins."
  travel_fr: "Antibes / Nice → Pont du Countet : départ 12h00–13h00 au plus tard, on gare les voitures sur place, puis la randonnée commence."

