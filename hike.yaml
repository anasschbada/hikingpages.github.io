wildlife:
  title: "Wildlife to watch for · Faune à observer"
  description_en: "Walk quietly and give wildlife space. You may spot Alpine ibex, chamois and marmots; scan the sky for golden eagles or bearded vultures. Wolves are present but exceptionally elusive."
  description_fr: "Marchez discrètement et gardez vos distances. Vous pourrez apercevoir bouquetins, chamois et marmottes ; levez les yeux pour l’aigle royal ou le gypaète barbu. Le loup est présent mais très difficile à observer."
